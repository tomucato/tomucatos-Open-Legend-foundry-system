<header class="sheet-header">
  <img class="profile-img" src="{{item.img}}" data-action="editImage" data-edit="img" title="{{item.name}}"/>
  <div class="header-fields">
    <h1 class="charname"><input name="name" type="text" value="{{item.name}}" placeholder="Flaw Name"/></h1>
    <div class="item-stats flexrow gear-stats gear-flags">
      <label class="gear-check" data-tooltip="Make it private: when checked, this flaw is hidden from the system's selection lists (the character sheet's flaw picker). The flaw itself still works normally.">
        <input type="checkbox" name="system.private" {{checked system.private}}/>
        <span>Private <i class="fas fa-circle-info"></i></span>
      </label>
    </div>
  </div>
</header>

{{> "templates/generic/tab-navigation.hbs" tabs=tabs}}

<section class="sheet-body">
  <div class="tab description {{tabs.description.cssClass}}" data-group="primary" data-tab="description">
    <prose-mirror name="system.description" value="{{system.description}}" document-uuid="{{document.uuid}}" toggled {{#unless editable}}disabled{{/unless}}>
      {{{enrichedDescription}}}
    </prose-mirror>
  </div>
  <div class="tab effects {{tabs.effects.cssClass}}" data-group="primary" data-tab="effects">
    {{> "systems/tomucatos-open-legend-rpg-system/templates/item/parts/item-effects.hbs" effectsHint="These Active Effects are applied to the character while they have this flaw."}}
  </div>
</section>
